<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="circle-clip-nietzsche">
      <circle cx="100" cy="100" r="100"/>
    </clipPath>
  </defs>
  <g clip-path="url(#circle-clip-nietzsche)">
    <!-- Background circle -->
    <circle cx="100" cy="100" r="100" fill="#DC143C" opacity="0.2"/>
    <!-- 19th century clothing / shoulders -->
    <path d="M25,200 Q35,160 55,148 Q75,140 100,137 Q125,140 145,148 Q165,160 175,200 Z" fill="#DC143C" opacity="0.45"/>
    <!-- Suit jacket lapels -->
    <path d="M70,148 L85,160 L100,148" fill="none" stroke="#DC143C" stroke-width="2" opacity="0.6"/>
    <path d="M130,148 L115,160 L100,148" fill="none" stroke="#DC143C" stroke-width="2" opacity="0.6"/>
    <!-- Collar -->
    <path d="M80,144 L88,138 L100,145 L112,138 L120,144" fill="none" stroke="#DC143C" stroke-width="2.5" opacity="0.7"/>
    <!-- Necktie hint -->
    <path d="M96,148 L100,170 L104,148" fill="#DC143C" opacity="0.4"/>
    <!-- Neck -->
    <rect x="90" y="120" width="20" height="20" rx="5" fill="#D2A679"/>
    <!-- Head shape -->
    <ellipse cx="100" cy="78" rx="40" ry="46" fill="#D2A679"/>
    <!-- High forehead -->
    <path d="M60,76 Q58,40 78,30 Q100,20 122,30 Q142,40 140,76" fill="#D2A679"/>
    <!-- Hair - combed back, receding -->
    <path d="M58,72 Q56,42 76,30 Q100,18 124,30 Q144,42 142,72" fill="#DC143C" opacity="0.35"/>
    <!-- Hair texture -->
    <path d="M64,68 Q66,46 80,34" fill="none" stroke="#DC143C" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
    <path d="M72,70 Q74,50 88,38" fill="none" stroke="#DC143C" stroke-width="1.5" stroke-linecap="round" opacity="0.25"/>
    <path d="M136,68 Q134,46 120,34" fill="none" stroke="#DC143C" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
    <path d="M128,70 Q126,50 112,38" fill="none" stroke="#DC143C" stroke-width="1.5" stroke-linecap="round" opacity="0.25"/>
    <!-- High forehead exposed -->
    <path d="M66,68 Q74,48 100,42 Q126,48 134,68" fill="#D2A679"/>
    <!-- Ears -->
    <ellipse cx="58" cy="82" rx="5" ry="10" fill="#C49565"/>
    <ellipse cx="142" cy="82" rx="5" ry="10" fill="#C49565"/>
    <!-- Eyebrows - intense, furrowed -->
    <path d="M68,72 Q78,66 92,70" fill="none" stroke="#DC143C" stroke-width="3" stroke-linecap="round"/>
    <path d="M108,70 Q122,66 132,72" fill="none" stroke="#DC143C" stroke-width="3" stroke-linecap="round"/>
    <!-- Furrow between brows -->
    <path d="M95,68 L97,74" fill="none" stroke="#B8895A" stroke-width="1" opacity="0.4"/>
    <path d="M105,68 L103,74" fill="none" stroke="#B8895A" stroke-width="1" opacity="0.4"/>
    <!-- Eyes - intense, piercing -->
    <ellipse cx="82" cy="80" rx="7.5" ry="4.5" fill="white"/>
    <circle cx="84" cy="80" r="3.5" fill="#3A1010"/>
    <circle cx="85.5" cy="79" r="1.2" fill="white"/>
    <ellipse cx="118" cy="80" rx="7.5" ry="4.5" fill="white"/>
    <circle cx="116" cy="80" r="3.5" fill="#3A1010"/>
    <circle cx="117.5" cy="79" r="1.2" fill="white"/>
    <!-- Intense stare - lower eyelids -->
    <path d="M74,83 Q82,86 90,83" fill="none" stroke="#B8895A" stroke-width="0.8" opacity="0.4"/>
    <path d="M110,83 Q118,86 126,83" fill="none" stroke="#B8895A" stroke-width="0.8" opacity="0.4"/>
    <!-- Nose - prominent -->
    <path d="M100,83 L96,98 Q100,102 104,98 Z" fill="#C49565"/>
    <!-- ENORMOUS WALRUS MUSTACHE - his most famous feature -->
    <path d="M86,104 Q78,108 62,112 Q56,114 52,110 Q50,106 56,104 Q66,100 80,100 Q86,100 90,102 Z" fill="#DC143C" opacity="0.55"/>
    <path d="M114,104 Q122,108 138,112 Q144,114 148,110 Q150,106 144,104 Q134,100 120,100 Q114,100 110,102 Z" fill="#DC143C" opacity="0.55"/>
    <!-- Mustache center -->
    <path d="M90,102 Q95,106 100,104 Q105,106 110,102" fill="#DC143C" opacity="0.5"/>
    <!-- Mustache texture -->
    <path d="M82,102 Q72,106 60,108" fill="none" stroke="#DC143C" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    <path d="M76,104 Q68,108 58,110" fill="none" stroke="#DC143C" stroke-width="1.2" stroke-linecap="round" opacity="0.35"/>
    <path d="M118,102 Q128,106 140,108" fill="none" stroke="#DC143C" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    <path d="M124,104 Q132,108 142,110" fill="none" stroke="#DC143C" stroke-width="1.2" stroke-linecap="round" opacity="0.35"/>
    <!-- Mouth hidden behind mustache - just a hint -->
    <path d="M92,112 Q100,115 108,112" fill="none" stroke="#DC143C" stroke-width="1" stroke-linecap="round" opacity="0.3"/>
    <!-- Chin -->
    <path d="M88,120 Q100,126 112,120" fill="none" stroke="#B8895A" stroke-width="0.8" opacity="0.25"/>
    <!-- Forehead wrinkles -->
    <path d="M76,58 Q100,55 124,58" fill="none" stroke="#B8895A" stroke-width="0.8" opacity="0.35"/>
    <path d="M78,63 Q100,60 122,63" fill="none" stroke="#B8895A" stroke-width="0.8" opacity="0.3"/>
  </g>
</svg>