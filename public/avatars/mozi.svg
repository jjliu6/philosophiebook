<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="circle-clip-mozi">
      <circle cx="100" cy="100" r="100"/>
    </clipPath>
  </defs>
  <g clip-path="url(#circle-clip-mozi)">
    <!-- Background circle -->
    <circle cx="100" cy="100" r="100" fill="#DAA520" opacity="0.2"/>
    <!-- Robe / shoulders - sturdy, broad, worker-like -->
    <path d="M15,200 Q30,158 52,145 Q74,136 100,134 Q126,136 148,145 Q170,158 185,200 Z" fill="#DAA520" opacity="0.45"/>
    <!-- Simple robe - utilitarian, no fancy collar -->
    <path d="M70,145 L100,172 L130,145" fill="none" stroke="#DAA520" stroke-width="2.5"/>
    <!-- Robe cross-stitch detail - craftsman touch -->
    <line x1="62" y1="160" x2="72" y2="155" stroke="#B8900A" stroke-width="1" opacity="0.4"/>
    <line x1="128" y1="155" x2="138" y2="160" stroke="#B8900A" stroke-width="1" opacity="0.4"/>
    <!-- Broader neck - sturdy build -->
    <rect x="87" y="120" width="26" height="18" rx="5" fill="#D2A679"/>
    <!-- Head shape - broader, sturdier -->
    <path d="M62,82 Q62,40 100,36 Q138,40 138,82 L134,108 Q128,126 100,130 Q72,126 66,108 Z" fill="#D2A679"/>
    <!-- Hair - simple, practical style -->
    <path d="M62,80 Q62,38 100,32 Q138,38 138,80" fill="#3A2A15"/>
    <!-- Simple cloth headband - practical worker style -->
    <rect x="60" y="52" width="80" height="8" rx="2" fill="#DAA520" opacity="0.7"/>
    <!-- Headband knot on side -->
    <circle cx="60" cy="56" r="5" fill="#DAA520" opacity="0.6"/>
    <path d="M55,56 Q48,50 45,55" fill="none" stroke="#DAA520" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <path d="M55,56 Q48,62 45,58" fill="none" stroke="#DAA520" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <!-- Eyebrows - thick, practical, no-nonsense -->
    <path d="M72,76 Q82,73 92,76" fill="none" stroke="#3A2A15" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M108,76 Q118,73 128,76" fill="none" stroke="#3A2A15" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Eyes - direct, earnest, open -->
    <ellipse cx="82" cy="84" rx="8" ry="5" fill="white"/>
    <circle cx="83" cy="84" r="3.5" fill="#3A2A15"/>
    <circle cx="84.5" cy="83" r="1.2" fill="white"/>
    <ellipse cx="118" cy="84" rx="8" ry="5" fill="white"/>
    <circle cx="117" cy="84" r="3.5" fill="#3A2A15"/>
    <circle cx="118.5" cy="83" r="1.2" fill="white"/>
    <!-- Upper eyelids -->
    <path d="M73,82 Q82,79 91,82" fill="none" stroke="#B8895A" stroke-width="1"/>
    <path d="M109,82 Q118,79 127,82" fill="none" stroke="#B8895A" stroke-width="1"/>
    <!-- Nose - broad, practical -->
    <path d="M100,87 L96,100 Q100,105 104,100 Z" fill="#C49565"/>
    <!-- Wider nose bridge -->
    <path d="M95,102 Q100,106 105,102" fill="none" stroke="#B8895A" stroke-width="1"/>
    <!-- Mouth - determined, firm but kind -->
    <path d="M88,112 Q94,109 100,111 Q106,109 112,112" fill="none" stroke="#DAA520" stroke-width="2" stroke-linecap="round"/>
    <!-- Short practical beard -->
    <path d="M84,116 Q82,126 80,132" fill="none" stroke="#3A2A15" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M92,118 Q90,128 89,134" fill="none" stroke="#3A2A15" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    <path d="M100,119 Q100,130 100,136" fill="none" stroke="#3A2A15" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    <path d="M108,118 Q110,128 111,134" fill="none" stroke="#3A2A15" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    <path d="M116,116 Q118,126 120,132" fill="none" stroke="#3A2A15" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <!-- Short mustache -->
    <path d="M92,112 Q86,116 82,117" fill="none" stroke="#3A2A15" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
    <path d="M108,112 Q114,116 118,117" fill="none" stroke="#3A2A15" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
    <!-- Ears - practical -->
    <ellipse cx="61" cy="86" rx="5" ry="9" fill="#C49565"/>
    <ellipse cx="139" cy="86" rx="5" ry="9" fill="#C49565"/>
    <!-- Weathered skin marks - working outdoors -->
    <path d="M74,96 Q76,94 78,96" fill="none" stroke="#B8895A" stroke-width="0.7" opacity="0.4"/>
    <path d="M122,96 Q124,94 126,96" fill="none" stroke="#B8895A" stroke-width="0.7" opacity="0.4"/>
    <!-- Broader jaw - sturdy -->
    <path d="M66,105 Q72,122 100,128" fill="none" stroke="#C49565" stroke-width="0.8" opacity="0.3"/>
    <path d="M134,105 Q128,122 100,128" fill="none" stroke="#C49565" stroke-width="0.8" opacity="0.3"/>
  </g>
</svg>