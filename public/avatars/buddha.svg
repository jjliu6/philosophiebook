<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="circle-clip-buddha">
      <circle cx="100" cy="100" r="100"/>
    </clipPath>
  </defs>
  <g clip-path="url(#circle-clip-buddha)">
    <!-- Background circle -->
    <circle cx="100" cy="100" r="100" fill="#FF8C00" opacity="0.2"/>
    <!-- Mandala-like background pattern -->
    <g opacity="0.08">
      <circle cx="100" cy="100" r="90" fill="none" stroke="#FF8C00" stroke-width="1"/>
      <circle cx="100" cy="100" r="80" fill="none" stroke="#FF8C00" stroke-width="0.8"/>
      <circle cx="100" cy="100" r="70" fill="none" stroke="#FF8C00" stroke-width="0.6"/>
      <!-- Petal pattern -->
      <path d="M100,20 Q108,35 100,50 Q92,35 100,20" fill="#FF8C00"/>
      <path d="M100,150 Q108,165 100,180 Q92,165 100,150" fill="#FF8C00"/>
      <path d="M20,100 Q35,108 50,100 Q35,92 20,100" fill="#FF8C00"/>
      <path d="M150,100 Q165,108 180,100 Q165,92 150,100" fill="#FF8C00"/>
      <path d="M43,43 Q56,50 57,63 Q50,56 43,43" fill="#FF8C00"/>
      <path d="M157,43 Q150,50 143,63 Q150,56 157,43" fill="#FF8C00" transform="rotate(0,100,100)"/>
      <path d="M43,157 Q50,150 63,143 Q56,150 43,157" fill="#FF8C00"/>
      <path d="M157,157 Q150,150 143,143 Q150,150 157,157" fill="#FF8C00"/>
    </g>
    <!-- Robe / shoulders - monk's robe -->
    <path d="M20,200 Q35,158 58,146 Q78,138 100,136 Q122,138 142,146 Q165,158 180,200 Z" fill="#FF8C00" opacity="0.45"/>
    <!-- Robe draped over one shoulder (Buddhist monk style) -->
    <path d="M58,146 Q65,142 80,148 Q90,155 100,165" fill="none" stroke="#FF8C00" stroke-width="2" opacity="0.6"/>
    <path d="M50,155 Q68,148 85,152" fill="none" stroke="#FF8C00" stroke-width="1.5" opacity="0.4"/>
    <!-- Exposed shoulder hint (right shoulder bare - Theravada style) -->
    <path d="M125,146 Q135,150 145,155" fill="none" stroke="#D2A679" stroke-width="1.5" opacity="0.3"/>
    <!-- Neck -->
    <rect x="90" y="120" width="20" height="18" rx="5" fill="#D2A679"/>
    <!-- Three neck lines (Buddhist iconography) -->
    <path d="M90,124 Q100,126 110,124" fill="none" stroke="#C49565" stroke-width="0.6" opacity="0.4"/>
    <path d="M90,128 Q100,130 110,128" fill="none" stroke="#C49565" stroke-width="0.6" opacity="0.4"/>
    <path d="M90,132 Q100,134 110,132" fill="none" stroke="#C49565" stroke-width="0.6" opacity="0.4"/>
    <!-- Head shape - serene oval -->
    <ellipse cx="100" cy="82" rx="37" ry="44" fill="#D2A679"/>
    <!-- Ushnisha (top-knot / cranial bump) -->
    <ellipse cx="100" cy="34" rx="16" ry="12" fill="#1A3A80" opacity="0.7"/>
    <ellipse cx="100" cy="30" rx="10" ry="8" fill="#1A3A80" opacity="0.8"/>
    <!-- Curled hair pattern (snail-shell curls) -->
    <g fill="#1A3A80" opacity="0.65">
      <circle cx="72" cy="58" r="4"/>
      <circle cx="82" cy="52" r="4"/>
      <circle cx="92" cy="48" r="4"/>
      <circle cx="100" cy="46" r="4"/>
      <circle cx="108" cy="48" r="4"/>
      <circle cx="118" cy="52" r="4"/>
      <circle cx="128" cy="58" r="4"/>
      <circle cx="66" cy="66" r="4"/>
      <circle cx="76" cy="62" r="4"/>
      <circle cx="86" cy="56" r="4"/>
      <circle cx="96" cy="52" r="4"/>
      <circle cx="104" cy="52" r="4"/>
      <circle cx="114" cy="56" r="4"/>
      <circle cx="124" cy="62" r="4"/>
      <circle cx="134" cy="66" r="4"/>
      <circle cx="64" cy="74" r="4"/>
      <circle cx="136" cy="74" r="4"/>
      <circle cx="70" cy="72" r="3.5"/>
      <circle cx="130" cy="72" r="3.5"/>
    </g>
    <!-- Eyebrows - gentle arches -->
    <path d="M72,78 Q82,73 92,76" fill="none" stroke="#8B6914" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M108,76 Q118,73 128,78" fill="none" stroke="#8B6914" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Eyes - half closed, meditative, peaceful -->
    <path d="M74,86 Q82,82 90,86" fill="none" stroke="#4A3010" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M74,86 Q82,88 90,86" fill="none" stroke="#4A3010" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <!-- Slight iris visible through half-closed eyes -->
    <ellipse cx="82" cy="85.5" rx="4" ry="1.5" fill="#4A3010" opacity="0.4"/>
    <path d="M110,86 Q118,82 126,86" fill="none" stroke="#4A3010" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M110,86 Q118,88 126,86" fill="none" stroke="#4A3010" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <ellipse cx="118" cy="85.5" rx="4" ry="1.5" fill="#4A3010" opacity="0.4"/>
    <!-- Urna (third eye dot between brows) -->
    <circle cx="100" cy="74" r="2.5" fill="#FF8C00" opacity="0.6"/>
    <!-- Nose - gentle, refined -->
    <path d="M100,86 Q97,96 96,102 Q100,106 104,102 Q103,96 100,86" fill="#C49565" stroke="#B8895A" stroke-width="0.3"/>
    <!-- Mouth - serene, subtle smile (the "Buddha smile") -->
    <path d="M86,112 Q93,108 100,110 Q107,108 114,112" fill="none" stroke="#FF8C00" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Slight upward curl at corners - peaceful contentment -->
    <path d="M84,113 Q85,111 86,112" fill="none" stroke="#FF8C00" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    <path d="M114,112 Q115,111 116,113" fill="none" stroke="#FF8C00" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    <!-- No beard - clean shaven monk -->
    <!-- Elongated earlobes (Buddhist iconography - sign of wisdom) -->
    <path d="M62,84 Q56,84 55,92 Q54,104 58,114 Q60,116 62,112" fill="#C49565" stroke="#B8895A" stroke-width="0.5"/>
    <path d="M138,84 Q144,84 145,92 Q146,104 142,114 Q140,116 138,112" fill="#C49565" stroke="#B8895A" stroke-width="0.5"/>
    <!-- Subtle halo effect -->
    <circle cx="100" cy="78" r="55" fill="none" stroke="#FF8C00" stroke-width="1" opacity="0.1"/>
    <circle cx="100" cy="78" r="60" fill="none" stroke="#FF8C00" stroke-width="0.5" opacity="0.08"/>
  </g>
</svg>