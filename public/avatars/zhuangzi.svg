<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="circle-clip-zhuangzi">
      <circle cx="100" cy="100" r="100"/>
    </clipPath>
  </defs>
  <g clip-path="url(#circle-clip-zhuangzi)">
    <!-- Background circle -->
    <circle cx="100" cy="100" r="100" fill="#20B2AA" opacity="0.2"/>
    <!-- Subtle butterfly motif in background -->
    <g opacity="0.12">
      <path d="M155,30 Q170,20 175,35 Q178,48 165,45 Q158,42 155,30 Z" fill="#20B2AA"/>
      <path d="M175,35 Q190,25 192,40 Q192,52 180,48 Q174,46 175,35 Z" fill="#20B2AA"/>
      <path d="M155,45 Q165,55 160,60 Q152,58 150,48 Q152,42 155,45 Z" fill="#20B2AA"/>
      <path d="M175,48 Q185,58 180,62 Q172,60 170,50 Q172,45 175,48 Z" fill="#20B2AA"/>
      <circle cx="165" cy="42" r="1.5" fill="#20B2AA"/>
    </g>
    <!-- Another butterfly, smaller -->
    <g opacity="0.08">
      <path d="M28,55 Q38,48 42,58 Q44,66 35,64 Q30,62 28,55 Z" fill="#20B2AA"/>
      <path d="M42,58 Q52,50 54,60 Q54,68 46,66 Q42,64 42,58 Z" fill="#20B2AA"/>
    </g>
    <!-- Robe / shoulders - casual, loose -->
    <path d="M22,200 Q35,162 58,148 Q78,138 100,136 Q122,138 142,148 Q165,162 178,200 Z" fill="#20B2AA" opacity="0.4"/>
    <!-- Robe collar - loosely tied -->
    <path d="M72,148 Q88,168 100,176 Q112,168 128,148" fill="none" stroke="#20B2AA" stroke-width="2" opacity="0.6"/>
    <!-- Neck -->
    <rect x="90" y="122" width="20" height="16" rx="5" fill="#D2A679"/>
    <!-- Head shape - slightly rounder, approachable -->
    <ellipse cx="100" cy="84" rx="37" ry="43" fill="#D2A679"/>
    <!-- Hair - casual, slightly messy, carefree style -->
    <path d="M63,82 Q63,42 100,36 Q137,42 137,82" fill="#3A2515"/>
    <!-- Hair - loose, casual top knot -->
    <path d="M88,38 Q90,24 100,20 Q110,24 112,38" fill="#3A2515"/>
    <path d="M92,22 Q100,14 108,22" fill="#3A2515"/>
    <!-- Loose hair strands - carefree -->
    <path d="M68,50 Q62,55 58,52" fill="none" stroke="#3A2515" stroke-width="2" stroke-linecap="round"/>
    <path d="M132,50 Q138,55 142,52" fill="none" stroke="#3A2515" stroke-width="2" stroke-linecap="round"/>
    <!-- Eyebrows - relaxed, slightly raised (amused) -->
    <path d="M72,76 Q82,72 92,75" fill="none" stroke="#3A2515" stroke-width="2" stroke-linecap="round"/>
    <path d="M108,75 Q118,72 128,76" fill="none" stroke="#3A2515" stroke-width="2" stroke-linecap="round"/>
    <!-- Eyes - bright, amused, lively -->
    <ellipse cx="82" cy="84" rx="8" ry="5.5" fill="white"/>
    <circle cx="84" cy="84" r="3.5" fill="#1A3A35"/>
    <circle cx="85.5" cy="83" r="1.5" fill="white"/>
    <ellipse cx="118" cy="84" rx="8" ry="5.5" fill="white"/>
    <circle cx="116" cy="84" r="3.5" fill="#1A3A35"/>
    <circle cx="117.5" cy="83" r="1.5" fill="white"/>
    <!-- Smile lines around eyes (laughing) -->
    <path d="M69,86 Q68,83 70,80" fill="none" stroke="#B8895A" stroke-width="0.8" opacity="0.5"/>
    <path d="M131,80 Q132,83 131,86" fill="none" stroke="#B8895A" stroke-width="0.8" opacity="0.5"/>
    <!-- Nose -->
    <path d="M100,87 L97,100 Q100,104 103,100 Z" fill="#C49565"/>
    <!-- Mouth - playful smile, wider than others -->
    <path d="M84,110 Q92,116 100,114 Q108,116 116,110" fill="none" stroke="#20B2AA" stroke-width="2" stroke-linecap="round"/>
    <!-- Slight teeth showing in smile -->
    <path d="M90,112 Q100,116 110,112" fill="white" opacity="0.3"/>
    <!-- Light beard - not too long -->
    <path d="M82,116 Q78,130 76,140" fill="none" stroke="#3A2515" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M92,118 Q88,132 86,142" fill="none" stroke="#3A2515" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    <path d="M108,118 Q112,132 114,142" fill="none" stroke="#3A2515" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    <path d="M118,116 Q122,130 124,140" fill="none" stroke="#3A2515" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <!-- Light mustache -->
    <path d="M92,112 Q86,117 80,118" fill="none" stroke="#3A2515" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
    <path d="M108,112 Q114,117 120,118" fill="none" stroke="#3A2515" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
    <!-- Ears -->
    <ellipse cx="62" cy="86" rx="5" ry="9" fill="#C49565"/>
    <ellipse cx="138" cy="86" rx="5" ry="9" fill="#C49565"/>
    <!-- Small butterfly near shoulder - signature motif -->
    <g transform="translate(148, 135) scale(0.8)" opacity="0.6">
      <path d="M0,0 Q8,-8 12,-2 Q14,4 6,5 Q2,4 0,0 Z" fill="#20B2AA"/>
      <path d="M12,-2 Q20,-8 22,-1 Q22,5 16,5 Q13,4 12,-2 Z" fill="#20B2AA"/>
      <path d="M0,5 Q5,10 3,13 Q-1,12 -2,7 Q-1,4 0,5 Z" fill="#20B2AA" opacity="0.7"/>
      <path d="M12,5 Q17,10 15,13 Q11,12 10,7 Q11,4 12,5 Z" fill="#20B2AA" opacity="0.7"/>
      <line x1="6" y1="0" x2="4" y2="-6" stroke="#20B2AA" stroke-width="0.5"/>
      <line x1="6" y1="0" x2="8" y2="-6" stroke="#20B2AA" stroke-width="0.5"/>
    </g>
  </g>
</svg>