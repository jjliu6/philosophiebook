<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="circle-clip-hanfeizi">
      <circle cx="100" cy="100" r="100"/>
    </clipPath>
  </defs>
  <g clip-path="url(#circle-clip-hanfeizi)">
    <!-- Background circle -->
    <circle cx="100" cy="100" r="100" fill="#4A4A4A" opacity="0.2"/>
    <!-- Robe / shoulders - structured, angular -->
    <path d="M18,200 L50,150 Q75,138 100,136 Q125,138 150,150 L182,200 Z" fill="#4A4A4A" opacity="0.5"/>
    <!-- Robe collar - strict, formal -->
    <path d="M72,150 L100,178 L128,150" fill="none" stroke="#4A4A4A" stroke-width="3"/>
    <path d="M76,152 L100,172 L124,152" fill="none" stroke="#4A4A4A" stroke-width="1.5" opacity="0.5"/>
    <!-- Armor-like shoulder details -->
    <path d="M50,150 Q55,148 60,150" fill="none" stroke="#3A3A3A" stroke-width="1.5"/>
    <path d="M140,150 Q145,148 150,150" fill="none" stroke="#3A3A3A" stroke-width="1.5"/>
    <!-- Neck -->
    <rect x="90" y="120" width="20" height="18" rx="4" fill="#D2A679"/>
    <!-- Head shape - angular, sharp jaw -->
    <path d="M63,80 Q63,42 100,38 Q137,42 137,80 L132,110 Q125,128 100,132 Q75,128 68,110 Z" fill="#D2A679"/>
    <!-- Hair - severe, tightly pulled back -->
    <path d="M63,78 Q63,38 100,32 Q137,38 137,78 L135,70 Q135,36 100,30 Q65,36 65,70 Z" fill="#2A2A2A"/>
    <!-- Formal official hat - angular, structured -->
    <path d="M60,56 L60,42 L140,42 L140,56 Z" fill="#2A2A2A"/>
    <path d="M65,42 L65,32 Q100,26 135,32 L135,42 Z" fill="#333333"/>
    <!-- Hat wing extensions - official Legalist hat style -->
    <path d="M60,48 L42,44 L42,48 L60,52 Z" fill="#2A2A2A"/>
    <path d="M140,48 L158,44 L158,48 L140,52 Z" fill="#2A2A2A"/>
    <!-- Hat band -->
    <rect x="60" y="52" width="80" height="4" fill="#3A3A3A"/>
    <!-- Eyebrows - stern, angled sharply downward toward center -->
    <path d="M70,74 L92,78" fill="none" stroke="#2A2A2A" stroke-width="3" stroke-linecap="round"/>
    <path d="M108,78 L130,74" fill="none" stroke="#2A2A2A" stroke-width="3" stroke-linecap="round"/>
    <!-- Eyes - intense, narrowed, piercing -->
    <path d="M74,84 Q82,80 90,84" fill="none" stroke="#2A2A2A" stroke-width="1.8"/>
    <path d="M74,84 Q82,87 90,84" fill="white"/>
    <circle cx="82" cy="84" r="3" fill="#1A1A1A"/>
    <circle cx="83" cy="83" r="1" fill="white"/>
    <path d="M110,84 Q118,80 126,84" fill="none" stroke="#2A2A2A" stroke-width="1.8"/>
    <path d="M110,84 Q118,87 126,84" fill="white"/>
    <circle cx="118" cy="84" r="3" fill="#1A1A1A"/>
    <circle cx="119" cy="83" r="1" fill="white"/>
    <!-- Nose - strong, angular -->
    <path d="M100,86 L96,100 L100,104 L104,100 Z" fill="#C49565" stroke="#B8895A" stroke-width="0.5"/>
    <!-- Mouth - thin, stern, straight -->
    <line x1="88" y1="112" x2="112" y2="112" stroke="#4A4A4A" stroke-width="2" stroke-linecap="round"/>
    <!-- Very slight downturn at corners -->
    <path d="M86,112 Q87,114 88,112" fill="none" stroke="#4A4A4A" stroke-width="1.2"/>
    <path d="M112,112 Q113,114 114,112" fill="none" stroke="#4A4A4A" stroke-width="1.2"/>
    <!-- No beard or minimal stubble - clean cut, authoritative -->
    <path d="M92,115 Q92,118 91,120" fill="none" stroke="#4A4A4A" stroke-width="0.8" opacity="0.3"/>
    <path d="M100,116 Q100,119 100,121" fill="none" stroke="#4A4A4A" stroke-width="0.8" opacity="0.3"/>
    <path d="M108,115 Q108,118 109,120" fill="none" stroke="#4A4A4A" stroke-width="0.8" opacity="0.3"/>
    <!-- Ears -->
    <ellipse cx="62" cy="84" rx="5" ry="9" fill="#C49565"/>
    <ellipse cx="138" cy="84" rx="5" ry="9" fill="#C49565"/>
    <!-- Sharp jaw lines -->
    <path d="M68,105 Q75,124 100,130" fill="none" stroke="#B8895A" stroke-width="0.8" opacity="0.4"/>
    <path d="M132,105 Q125,124 100,130" fill="none" stroke="#B8895A" stroke-width="0.8" opacity="0.4"/>
    <!-- Frown lines between brows -->
    <line x1="96" y1="72" x2="97" y2="78" stroke="#B8895A" stroke-width="0.8" opacity="0.5"/>
    <line x1="103" y1="78" x2="104" y2="72" stroke="#B8895A" stroke-width="0.8" opacity="0.5"/>
  </g>
</svg>