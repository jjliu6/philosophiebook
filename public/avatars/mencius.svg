<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="circle-clip-mencius">
      <circle cx="100" cy="100" r="100"/>
    </clipPath>
  </defs>
  <g clip-path="url(#circle-clip-mencius)">
    <!-- Background circle -->
    <circle cx="100" cy="100" r="100" fill="#B22222" opacity="0.2"/>
    <!-- Robe / shoulders -->
    <path d="M25,200 Q38,158 60,145 Q78,137 100,135 Q122,137 140,145 Q162,158 175,200 Z" fill="#B22222" opacity="0.5"/>
    <!-- Robe collar - crossed traditional style -->
    <path d="M78,145 L100,175 L122,145" fill="none" stroke="#B22222" stroke-width="2.5"/>
    <path d="M82,148 L100,168" fill="none" stroke="#B22222" stroke-width="1.5" opacity="0.6"/>
    <path d="M118,148 L100,168" fill="none" stroke="#B22222" stroke-width="1.5" opacity="0.6"/>
    <!-- Neck -->
    <rect x="90" y="122" width="20" height="18" rx="5" fill="#D2A679"/>
    <!-- Head shape - slightly more angular, younger -->
    <ellipse cx="100" cy="85" rx="36" ry="42" fill="#D2A679"/>
    <!-- Hair - traditional tied-up style -->
    <path d="M64,80 Q64,42 100,38 Q136,42 136,80" fill="#2A1506"/>
    <!-- Top knot / bun -->
    <ellipse cx="100" cy="36" rx="14" ry="10" fill="#2A1506"/>
    <!-- Hair pin -->
    <line x1="82" y1="36" x2="118" y2="36" stroke="#B22222" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Eyebrows - strong, confident -->
    <path d="M72,76 Q82,70 93,74" fill="none" stroke="#2A1506" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M107,74 Q118,70 128,76" fill="none" stroke="#2A1506" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Eyes - alert, confident -->
    <ellipse cx="82" cy="83" rx="8" ry="5" fill="white"/>
    <circle cx="84" cy="83" r="3.5" fill="#2A1506"/>
    <circle cx="85" cy="82" r="1.2" fill="white"/>
    <ellipse cx="118" cy="83" rx="8" ry="5" fill="white"/>
    <circle cx="116" cy="83" r="3.5" fill="#2A1506"/>
    <circle cx="117" cy="82" r="1.2" fill="white"/>
    <!-- Upper eyelids -->
    <path d="M73,81 Q82,77 91,81" fill="none" stroke="#B8895A" stroke-width="1"/>
    <path d="M109,81 Q118,77 127,81" fill="none" stroke="#B8895A" stroke-width="1"/>
    <!-- Nose - refined -->
    <path d="M100,86 L97,100 Q100,104 103,100 Z" fill="#C49565"/>
    <!-- Mouth - confident, slight determined set -->
    <path d="M89,110 Q95,108 100,110 Q105,108 111,110" fill="none" stroke="#B22222" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Short beard - younger than Confucius -->
    <path d="M85,114 Q83,125 80,132" fill="none" stroke="#3A2010" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M92,116 Q90,128 88,135" fill="none" stroke="#3A2010" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M100,117 Q100,130 100,138" fill="none" stroke="#3A2010" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M108,116 Q110,128 112,135" fill="none" stroke="#3A2010" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M115,114 Q117,125 120,132" fill="none" stroke="#3A2010" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <!-- Short mustache -->
    <path d="M90,110 Q85,116 80,118" fill="none" stroke="#3A2010" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M110,110 Q115,116 120,118" fill="none" stroke="#3A2010" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <!-- Ears -->
    <ellipse cx="63" cy="86" rx="5" ry="9" fill="#C49565"/>
    <ellipse cx="137" cy="86" rx="5" ry="9" fill="#C49565"/>
    <!-- Jaw line - more defined than Confucius -->
    <path d="M66,95 Q68,118 100,128 Q132,118 134,95" fill="none" stroke="#C49565" stroke-width="0.8" opacity="0.3"/>
  </g>
</svg>