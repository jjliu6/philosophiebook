<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="circle-clip-beauvoir">
      <circle cx="100" cy="100" r="100"/>
    </clipPath>
  </defs>
  <g clip-path="url(#circle-clip-beauvoir)">
    <!-- Background circle -->
    <circle cx="100" cy="100" r="100" fill="#C71585" opacity="0.2"/>
    <!-- 1940s clothing / shoulders -->
    <path d="M25,200 Q35,158 55,146 Q78,138 100,136 Q122,138 145,146 Q165,158 175,200 Z" fill="#C71585" opacity="0.45"/>
    <!-- Blouse collar / neckline -->
    <path d="M75,146 Q82,140 92,142 Q100,138 108,142 Q118,140 125,146" fill="none" stroke="#C71585" stroke-width="2" opacity="0.6"/>
    <!-- Collar detail -->
    <path d="M80,148 Q90,144 100,148 Q110,144 120,148" fill="none" stroke="#C71585" stroke-width="1.5" opacity="0.4"/>
    <!-- Neck - elegant -->
    <rect x="90" y="120" width="20" height="20" rx="5" fill="#E8C9A0"/>
    <!-- Head shape - feminine, elegant -->
    <ellipse cx="100" cy="80" rx="38" ry="44" fill="#E8C9A0"/>
    <!-- Hair pulled back with turban/wrap -->
    <path d="M60,74 Q58,38 80,26 Q100,18 120,26 Q142,38 140,74" fill="#C71585" opacity="0.45"/>
    <!-- Turban/head wrap -->
    <path d="M58,60 Q60,40 80,30 Q100,22 120,30 Q140,40 142,60" fill="#C71585" opacity="0.55"/>
    <!-- Turban wrap lines -->
    <path d="M62,55 Q100,42 138,55" fill="none" stroke="#C71585" stroke-width="2.5" opacity="0.5"/>
    <path d="M65,48 Q100,36 135,48" fill="none" stroke="#C71585" stroke-width="2" opacity="0.4"/>
    <!-- Turban knot/fold at top -->
    <path d="M92,26 Q96,20 100,22 Q104,20 108,26" fill="#C71585" opacity="0.5"/>
    <!-- Hair visible at sides -->
    <path d="M60,68 Q58,80 60,92 Q62,100 64,108" fill="none" stroke="#C71585" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
    <path d="M140,68 Q142,80 140,92 Q138,100 136,108" fill="none" stroke="#C71585" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
    <!-- Ears - partially hidden by hair -->
    <ellipse cx="60" cy="84" rx="4" ry="8" fill="#D4AD7A"/>
    <ellipse cx="140" cy="84" rx="4" ry="8" fill="#D4AD7A"/>
    <!-- Earrings -->
    <circle cx="60" cy="94" r="2" fill="#C71585" opacity="0.5"/>
    <circle cx="140" cy="94" r="2" fill="#C71585" opacity="0.5"/>
    <!-- Eyebrows - defined, elegant arch -->
    <path d="M72,72 Q80,67 92,71" fill="none" stroke="#C71585" stroke-width="2" stroke-linecap="round"/>
    <path d="M108,71 Q120,67 128,72" fill="none" stroke="#C71585" stroke-width="2" stroke-linecap="round"/>
    <!-- Eyes - direct, confident, larger/feminine -->
    <ellipse cx="82" cy="80" rx="8" ry="5" fill="white"/>
    <circle cx="84" cy="80" r="3.5" fill="#3A1528"/>
    <circle cx="85.5" cy="79" r="1.2" fill="white"/>
    <ellipse cx="118" cy="80" rx="8" ry="5" fill="white"/>
    <circle cx="116" cy="80" r="3.5" fill="#3A1528"/>
    <circle cx="117.5" cy="79" r="1.2" fill="white"/>
    <!-- Eyelashes - subtle -->
    <path d="M74,78 Q76,76 78,78" fill="none" stroke="#5A1530" stroke-width="0.8" opacity="0.4"/>
    <path d="M86,78 Q88,76 90,78" fill="none" stroke="#5A1530" stroke-width="0.8" opacity="0.4"/>
    <path d="M110,78 Q112,76 114,78" fill="none" stroke="#5A1530" stroke-width="0.8" opacity="0.4"/>
    <path d="M122,78 Q124,76 126,78" fill="none" stroke="#5A1530" stroke-width="0.8" opacity="0.4"/>
    <!-- Upper eyelid crease -->
    <path d="M74,77 Q82,74 90,77" fill="none" stroke="#D4AD7A" stroke-width="0.8" opacity="0.4"/>
    <path d="M110,77 Q118,74 126,77" fill="none" stroke="#D4AD7A" stroke-width="0.8" opacity="0.4"/>
    <!-- Nose - refined, feminine -->
    <path d="M100,84 L98,96 Q100,99 102,96 Z" fill="#D4AD7A"/>
    <!-- Nostrils hint -->
    <circle cx="97" cy="97" r="1.5" fill="#C9A06A" opacity="0.3"/>
    <circle cx="103" cy="97" r="1.5" fill="#C9A06A" opacity="0.3"/>
    <!-- Lips - defined, feminine -->
    <path d="M90,108 Q95,104 100,106 Q105,104 110,108" fill="#C71585" opacity="0.3"/>
    <path d="M90,108 Q95,112 100,110 Q105,112 110,108" fill="#C71585" opacity="0.25"/>
    <!-- Lip line -->
    <path d="M90,108 Q100,107 110,108" fill="none" stroke="#C71585" stroke-width="1" opacity="0.4"/>
    <!-- Cheekbone definition -->
    <path d="M68,92 Q72,90 76,92" fill="none" stroke="#D4AD7A" stroke-width="0.8" opacity="0.3"/>
    <path d="M124,92 Q128,90 132,92" fill="none" stroke="#D4AD7A" stroke-width="0.8" opacity="0.3"/>
    <!-- Chin -->
    <path d="M94,120 Q100,124 106,120" fill="none" stroke="#D4AD7A" stroke-width="0.6" opacity="0.25"/>
    <!-- Nasolabial lines - subtle -->
    <path d="M92,96 Q90,102 88,108" fill="none" stroke="#D4AD7A" stroke-width="0.6" opacity="0.25"/>
    <path d="M108,96 Q110,102 112,108" fill="none" stroke="#D4AD7A" stroke-width="0.6" opacity="0.25"/>
  </g>
</svg>